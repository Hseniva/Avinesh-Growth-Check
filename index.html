   tracking:{title:"Mise en place du suivi (GA4, Tag Manager, Pixel)",lead:"Pour savoir exactement quelles publicités apportent des demandes et des ventes."},
   training:{title:"Vous voulez former votre équipe ?",lead:"Mes programmes Digital Marketing & AI Bootcamp, Data & Analytics Mastery et Mastering AI Tools for Marketers sont approuvés par la MQA, avec des certificats officiellement reconnus. Les employeurs à Maurice peuvent se faire rembourser via le HRDC (levy refund scheme).",badges:["Approuvé MQA","Remboursable HRDC"],link:"Voir les programmes de formation →"},
   audit:{title:"Votre audit gratuit du site ou de la page Facebook",lead:"Comme promis, j'analyse personnellement votre site ou votre page Facebook et je vous envoie un court rapport avec des actions rapides et concrètes.",free:"Gratuit, c'est offert"},
   noSite:{title:"Commencez par une page simple",lead:"Les publicités ont besoin d'une page où envoyer les visiteurs. Je vous conseille l'option la plus simple pour votre activité."},
   spendIntl:"Budget publicitaire conseillé : à partir de 2 000 € / mois, payé directement à Meta ou Google.",
   spendLocal:"Le budget publicitaire est payé directement à Meta ou Google, en plus des honoraires. On le définit ensemble.",
   from:"à partir de", feeNote:"Prix hors budget publicitaire. Devis final après étude de vos réponses.",
   next:"La suite : j'étudie vos réponses et je vous envoie une proposition personnalisée sous 24 heures.",
   saveErr:"Votre plan est prêt ci-dessous, mais vos réponses n'ont pas pu être envoyées. Écrivez à admin@hseniva.com pour que je vous recontacte.",
   channel:{meta:"Facebook & Instagram",google:"Google",both:"Meta + Google",unsure:"Meta + Google"}

 }
};

/* ===== FLOW ===== */
const STEPS = [
 {id:"base",type:"one",cols:2},
 {id:"country",type:"text",show:a=>a.base==="abroad"},
 {id:"market",type:"one"},
 {id:"type",type:"one",cols:2},
 {id:"goal",type:"one"},
 {id:"now",type:"multi"},
 {id:"site",type:"one"},
 {id:"channel",type:"one",cols:2},
 {id:"budgetMu",type:"one",show:a=>a.base==="mu"},
 {id:"budgetIntl",type:"one",show:a=>a.base==="abroad"},
 {id:"time",type:"one"},
 {id:"when",type:"one",cols:3},
 {id:"contact",type:"contact"}
];

let lang = (navigator.language||"en").toLowerCase().startsWith("fr") ? "fr" : "en";
try{ const s=localStorage.getItem("ab_lang"); if(s) lang=s; }catch(e){}
let ans = {now:[]};
let i = -1; // -1 = intro
const app = document.getElementById("app");
const L = ()=>T[lang];
const visible = ()=>STEPS.filter(s=>!s.show||s.show(ans));
const esc = s=>String(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function setLang(l){
  lang=l; try{localStorage.setItem("ab_lang",l)}catch(e){}
  document.documentElement.lang=l;
  document.querySelectorAll(".lang button").forEach(b=>b.classList.toggle("on",b.dataset.l===l));
  document.getElementById("headq").textContent=L().headQ;
  document.getElementById("tagline").textContent=L().tagline;
  document.getElementById("tagsub").textContent=L().tagSub;
  render();
}
document.querySelectorAll(".lang button").forEach(b=>b.onclick=()=>setLang(b.dataset.l));

function render(){
  if(i===-1) return renderIntro();
  if(i==="result") return renderResult();
  const steps=visible(); const s=steps[i]; const q=L().q[s.id];
  const pct=Math.round((i)/steps.length*100);
  let h=`<div class="progress"><i style="width:${pct}%"></i></div><div class="step-n">${L().stepOf(i+1,steps.length)}</div><h2>${q.t}</h2>`;
  if(q.h) h+=`<p class="hint">${q.h}</p>`; else h+=`<div style="height:12px"></div>`;
  if(s.type==="one"||s.type==="multi"){
    h+=`<div class="opts ${s.cols===2?'two':''}">`;
    for(const [k,v] of Object.entries(q.o)){
      const on = s.type==="multi" ? ans[s.id].includes(k) : ans[s.id]===k;
      h+=`<button type="button" class="opt ${s.type==='multi'?'multi':''} ${on?'on':''}" data-k="${k}"><i class="dot"></i><span>${v}</span></button>`;
    }
    h+=`</div>`;
  } else if(s.type==="text"){
    h+=`<input class="t" id="tx" placeholder="${q.ph}" value="${esc(ans[s.id])}" autocomplete="country-name">`;
  } else if(s.type==="contact"){
    const f=(id,lab,type="text",ac="")=>`<label class="f" for="${id}">${lab}</label><input class="t" id="${id}" type="${type}" autocomplete="${ac}" value="${esc(ans[id])}">`;
    h+=f("name",q.name,"text","name")+f("biz",q.biz,"text","organization")+f("email",q.email,"email","email")+f("phone",q.phone,"tel","tel")+f("web",q.web,"url","url");
    h+=`<input class="hp" id="hp" tabindex="-1" autocomplete="off" aria-hidden="true">`;
  }
  const last = i===steps.length-1;
  h+=`<div class="err" id="err"></div><div class="nav"><button type="button" class="ghost" id="back">${i>0?"← "+L().back:""}</button><button type="button" class="btn" id="next">${last?L().send:L().next}</button></div>`;
  app.innerHTML=h;
  app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
    const k=b.dataset.k;
    if(s.type==="multi"){
      let a=ans[s.id]; if(k==="none") a=[]; else a=a.filter(x=>x!=="none");
      a = a.includes(k) ? a.filter(x=>x!==k) : a.concat(k); ans[s.id]=a; render();
    } else { ans[s.id]=k; render(); setTimeout(go,180); }
  });
  document.getElementById("back").onclick=()=>{ if(i>0){i--;render();} };
  document.getElementById("next").onclick=go;
  const tx=document.getElementById("tx"); if(tx){tx.focus(); tx.onkeydown=e=>{if(e.key==="Enter")go()}}
}

function go(){
  const steps=visible(); const s=steps[i]; const err=document.getElementById("err");
  if(s.type==="text"){ ans[s.id]=document.getElementById("tx").value.trim(); }
  if(s.type==="contact"){
    ["name","biz","email","phone","web"].forEach(k=>ans[k]=document.getElementById(k).value.trim());
    if(!ans.name || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(ans.email)){ err.textContent=L().contactErr; return; }
    if(document.getElementById("hp").value) return; // bot
    return submit();
  }
  const empty = s.type==="multi" ? !ans[s.id].length : !ans[s.id];
  if(empty && s.type!=="text"){ err.textContent=L().required; return; }
  i++; render(); window.scrollTo({top:0,behavior:"smooth"});
}

function renderIntro(){
  app.innerHTML=`<div class="intro"><div class="badge">${L().badge}</div><h1>${L().introTitle}</h1><p class="lead">${L().introLead}</p><div class="promise">🎁 ${L().promise}</div><ul>${L().introList.map(x=>`<li>${x}</li>`).join("")}</ul><button class="btn" id="start">${L().start} →</button></div>`;
  document.getElementById("start").onclick=()=>{i=0;render();abTrack("growth_check_start",{language:lang});};
}

/* ===== RECOMMENDATION ENGINE ===== */
function recommend(a){
  const local = a.base==="mu";
  const bands = local ? ["b1","b2","b3","b4","b5"] : ["i1","i2","i3","i4"];
  const budget = local ? a.budgetMu : a.budgetIntl;
  const high = bands.indexOf(budget) >= bands.indexOf(local?LOCAL_THRESHOLD_STEP:INTL_THRESHOLD_STEP);
  const ch = a.channel==="unsure" ? "both" : a.channel;
  const main = high ? {kind:"manage", price:ch} : {kind:"coach", price:"coaching"};
  const extras = [];
  if(!high){
    extras.push({kind:"consult",price:"consult"});
    if(a.time==="done" && !local) extras.push({kind:"doneAlt",price:ch});
    if(a.time==="done" && local) extras.push({kind:"timeNote",price:"expert"});
  }
  if(a.site==="none") extras.push({kind:"noSite"});
  else if(a.site!=="ok" || a.goal==="measure") extras.push({kind:"tracking",price:"tracking"});
  extras.push({kind:"audit",free:true});
  if(local) extras.push({kind:"training"});
  return {local, high, channel:ch, main, extras};
}

function priceTxt(key, local){
  const p=PRICES[key]; if(!p) return "";
  const unit = lang==="fr"?p.unitFr:p.unitEn;
  let amt = local ? p.rs : p.eur;
  if(lang==="fr"){ amt = local ? amt.replace(",", "\u202f") : amt.replace("€","").replace(",", "\u202f")+"\u00a0€"; }
  return `${L().r.from} ${amt} <small>${unit.startsWith("/")?unit:"· "+unit}</small>`;
}


function readable(a){
  const q=T.en.q, o={};
  for(const [k,v] of Object.entries(a)){
    if(k.startsWith("_")) continue;
    if(Array.isArray(v)) o[k]=v.map(x=>(q[k]&&q[k].o&&q[k].o[x])||x).join(", ");
    else o[k]=(q[k]&&q[k].o&&q[k].o[v])||v;
  }
  return o;
}

async function submit(){
  const btn=document.getElementById("next"); btn.disabled=true; btn.textContent=L().sending;
  const rec=recommend(ans);
  const payload={
    ts:new Date().toISOString(), lang, ...readable(ans),
    segment: rec.local ? (ans.market==="local"?"Local → local market":ans.market==="intl"?"Local → international market":"Local → mixed") : "International",
    recommendation: rec.main.kind==="manage" ? `Ads management (${rec.channel})` : "Ads coaching pack + consulting",
    extras: rec.extras.map(e=>e.kind).join(", "),
    quoted: rec.main.kind==="manage" ? (rec.local?PRICES[rec.channel].rs:PRICES[rec.channel].eur) : (rec.local?PRICES.coaching.rs:PRICES.coaching.eur),
    page: location.href
  };
  let ok=true;
  if(ENDPOINT && !ENDPOINT.startsWith("PASTE")){
    try{ await fetch(ENDPOINT,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(payload)}); }
    catch(e){ ok=false; }
  }
  abTrack("growth_check_lead",{lead_type:"Growth Check lead",lead_segment:payload.segment,lead_recommendation:payload.recommendation,language:lang},"Lead");
  i="result"; ans._ok=ok; render(); window.scrollTo({top:0,behavior:"smooth"});
}

function renderResult(){
  const r=L().r; const rec=recommend(ans); const m=rec.main;
  const chName=r.channel[ans.channel]||r.channel.both;
  let h=`<div class="progress"><i style="width:100%"></i></div><div class="badge">${r.badge}</div><h1>${r.title}</h1><p class="lead">${r.for(esc(ans.biz||ans.name))}</p>`;
  if(m.kind==="manage"){
    h+=`<div class="rec"><span class="tag">${r.manage.tag}</span><h2>${r.manage.title(chName)}</h2><div class="price">${priceTxt(m.price,rec.local)}</div><p class="lead" style="margin-top:10px">${r.manage.lead}</p><ul>${r.manage.items.map(x=>`<li>${x}</li>`).join("")}</ul>${!rec.local?`<p class="note">${r.spendIntl}</p>`:`<p class="note">${r.spendLocal}</p>`}</div>`;
  } else {
    h+=`<div class="rec"><span class="tag">${r.coach.tag}</span><h2>${r.coach.title}</h2><div class="price">${priceTxt("coaching",rec.local)}</div><p class="lead" style="margin-top:10px">${r.coach.lead}</p><ul>${r.coach.items.map(x=>`<li>${x}</li>`).join("")}</ul><p class="note">${r.spendLocal}</p></div>`;
  }
  for(const e of rec.extras){
    const t=r[e.kind]; const pr = e.free ? r.audit.free : (e.price?priceTxt(e.price,rec.local):"");
    h+=`<div class="extra"><h3>${t.title}</h3>${t.badges?`<div class="tbadges">${t.badges.map(b=>`<span>✓ ${b}</span>`).join("")}</div>`:""}<div style="color:var(--muted);line-height:1.5;font-size:14.5px">${t.lead}</div>${pr?`<div class="p">${pr}</div>`:""}${t.link?`<a class="tlink" href="https://avineshbundhoo.com/digital-marketing-training" target="_blank" rel="noopener">${t.link}</a>`:""}</div>`;
  }
  h+=`<p class="note">${r.feeNote}</p><p class="lead" style="margin-top:14px">${r.next}</p>`;
  if(!ans._ok) h+=`<p class="err">${r.saveErr}</p>`;
  app.innerHTML=h;
}

setLang(lang);
</script>

</style>
<script>
(function(){
  var box=document.getElementById("ck");
  var TX={en:{t:'I use cookies to measure my ads and improve this page. <a href="privacy/">Privacy policy</a>',y:"Accept",n:"Reject"},
          fr:{t:"J\u2019utilise des cookies pour mesurer mes publicités et améliorer cette page. <a href=\"privacy/\">Politique de confidentialité</a>",y:"Accepter",n:"Refuser"}};
  function show(){var l=(document.documentElement.lang||"en").slice(0,2);var x=TX[l]||TX.en;
    document.getElementById("ck-t").innerHTML=x.t;document.getElementById("ck-yes").textContent=x.y;document.getElementById("ck-no").textContent=x.n;box.hidden=false;}
  function save(v){try{localStorage.setItem(AB_CONSENT_KEY,v)}catch(e){}
    var g=v==="granted"?"granted":"denied";
    gtag("consent","update",{ad_storage:g,analytics_storage:g,ad_user_data:g,ad_personalization:g});
    if(v==="granted"){abLoadPixel();} else if(window.fbq){try{fbq("consent","revoke")}catch(e){}}
    box.hidden=true;}
  document.getElementById("ck-yes").onclick=function(){save("granted")};
  document.getElementById("ck-no").onclick=function(){save("denied")};
  document.getElementById("ck-open").onclick=function(e){e.preventDefault();show()};
  if(!abConsent()) show();
  document.querySelectorAll(".lang button").forEach(function(b){b.addEventListener("click",function(){if(!box.hidden)setTimeout(show,0)})});
})();
</script>
