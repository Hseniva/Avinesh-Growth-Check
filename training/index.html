<meta name="robots" content="noindex">

<style>
  :root{
    --bg:#080B10; --card:#0D1220; --panel2:#111829; --line:rgba(255,255,255,.07); --line2:rgba(255,255,255,.12);
    --text:#E2E8F0; --white:#fff; --muted:#6B7A99; --blue:#4F7CFF; --blue-soft:rgba(79,124,255,.1); --blue-line:rgba(79,124,255,.25); --blue-text:#7B9FFF;
    --gold:#E8A045; --warn:#E8A045; --radius:20px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,sans-serif;-webkit-font-smoothing:antialiased}
  body{min-height:100vh;display:flex;flex-direction:column;background:radial-gradient(900px 500px at 85% -10%,rgba(79,124,255,.12),transparent 60%),var(--bg)}
  header{border-bottom:1px solid var(--line)}
  .bar{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;max-width:780px;margin:0 auto}
  .brand{font-weight:800;font-size:18px;color:var(--white);text-decoration:none;letter-spacing:-.3px}
  .brand b{color:var(--blue)}
  .lang{display:flex;border:1px solid var(--line2);border-radius:8px;overflow:hidden}
  .lang button{background:none;border:0;color:var(--muted);padding:7px 12px;font:600 13px Inter,sans-serif;cursor:pointer}
  .lang button.on{background:var(--blue);color:#fff}
  main{flex:1;width:100%;max-width:780px;margin:0 auto;padding:28px 16px 48px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:32px 28px}
  @media (max-width:560px){.card{padding:24px 18px}}
  .badge{display:inline-flex;align-items:center;gap:8px;background:var(--blue-soft);border:1px solid var(--blue-line);color:var(--blue-text);border-radius:100px;padding:6px 14px;font-size:13px;font-weight:500;margin-bottom:18px}
  .badge:before{content:"";width:6px;height:6px;border-radius:50%;background:var(--blue)}
  .grad{background:linear-gradient(90deg,#4F7CFF,#E8A045);-webkit-background-clip:text;background-clip:text;color:transparent}
  .progress{height:4px;background:var(--panel2);border-radius:99px;overflow:hidden;margin:0 0 22px}
  .progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,#4F7CFF,#E8A045);transition:width .3s}
  .step-n{color:var(--blue-text);font-size:13px;font-weight:600;margin-bottom:8px}
  h1{font-size:40px;line-height:1.08;font-weight:900;letter-spacing:-1.2px;color:var(--white);margin:0 0 14px}
  @media (max-width:560px){h1{font-size:31px;letter-spacing:-.8px}}
  h2{font-size:23px;line-height:1.3;font-weight:800;letter-spacing:-.4px;color:var(--white);margin:0 0 6px}
  p.lead,.hint{color:var(--muted);line-height:1.7;margin:0 0 20px;font-size:16px}
  .hint{font-size:14px;margin-top:-2px}
  .opts{display:grid;gap:10px}
  .opts.two{grid-template-columns:1fr 1fr}
  @media (max-width:560px){.opts.two{grid-template-columns:1fr}}
  .opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:12px;padding:15px 16px;font:500 15px Inter,sans-serif;cursor:pointer;transition:border-color .15s,background .15s}
  .opt:hover{border-color:var(--blue-line)}
  .opt.on{border-color:var(--blue);background:var(--blue-soft)}
  .opt .dot{flex:none;width:18px;height:18px;border-radius:50%;border:2px solid #34405a;margin-top:1px}
  .opt.multi .dot{border-radius:5px}
  .opt.on .dot{border-color:var(--blue);background:var(--blue);box-shadow:inset 0 0 0 3px var(--card)}
  label.f{display:block;font-size:14px;color:var(--muted);margin:14px 0 6px}
  input.t{width:100%;background:var(--panel2);border:1px solid var(--line2);color:var(--white);border-radius:10px;padding:13px 14px;font:15px Inter,sans-serif}
  input.t:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-soft)}
  .nav{display:flex;justify-content:space-between;align-items:center;margin-top:26px;gap:10px}
  .btn{background:var(--blue);color:#fff;border:0;border-radius:8px;padding:13px 22px;font:600 15px Inter,sans-serif;cursor:pointer;transition:filter .15s}
  .btn:hover{filter:brightness(1.1)}
  .btn[disabled]{opacity:.5;cursor:not-allowed}
  .ghost{background:none;border:0;color:var(--muted);font:500 14px Inter,sans-serif;cursor:pointer;padding:10px 4px}
  .ghost:hover{color:var(--text)}
  .err{color:var(--warn);font-size:14px;margin-top:10px;min-height:18px}
  .intro ul{list-style:none;margin:0 0 26px;padding:0;color:var(--text);line-height:2}
  .intro li:before{content:"✓";color:var(--blue);font-weight:700;margin-right:10px}
  .rec{border:1px solid var(--blue-line);background:linear-gradient(180deg,rgba(79,124,255,.09),rgba(13,18,32,0) 70%),var(--card);border-radius:16px;padding:24px;margin:18px 0}

  .price small{font-size:14px;color:var(--muted);font-weight:500;letter-spacing:0}
  .rec ul{margin:12px 0 0;padding-left:18px;line-height:1.8}
  .extra{background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin-top:12px}
  .extra h3{margin:0 0 4px;font-size:16px;color:var(--white)}
  .extra .p{color:var(--gold);font-weight:700;font-size:14px;margin-top:6px}
  .note{color:var(--muted);font-size:13.5px;line-height:1.6;margin-top:16px}
  footer{color:var(--muted);font-size:13px;text-align:center;padding:22px;border-top:1px solid var(--line)}
  footer .links{display:flex;gap:10px;justify-content:center;margin-top:8px}
  footer a{color:var(--blue-text);text-decoration:none;font-weight:500}
  footer a:hover{color:var(--white);text-decoration:underline}
  .hp{position:absolute;left:-9999px}
  .scenario{background:var(--blue-soft);border:1px solid var(--blue-line);border-radius:14px;padding:18px 20px;margin:4px 0 22px;line-height:1.7;color:var(--text);font-size:15px}
  .scenario b{color:var(--white)}
  .scenario ul{margin:8px 0 0;padding-left:18px}
  .formula{font-weight:700;color:var(--white);background:var(--panel2);border-radius:8px;padding:10px 14px;margin:12px 0;display:inline-block}
  .qblock{margin-bottom:22px}
  .qlabel{display:block;color:var(--text);font-size:15.5px;line-height:1.6;font-weight:500;margin-bottom:10px}
  .qlabel b{color:var(--white)}
  textarea.t{width:100%;background:var(--panel2);border:1px solid var(--line2);color:var(--white);border-radius:10px;padding:13px 14px;font:15px/1.6 Inter,sans-serif;resize:vertical;min-height:110px}
  textarea.t:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-soft)}
  .opt b{color:var(--blue-text);margin-right:2px}
  .lk-legend{display:flex;justify-content:space-between;color:var(--muted);font-size:13px;margin:0 0 14px;padding:10px 14px;background:var(--panel2);border-radius:10px}
  .lk{padding:14px 0;border-bottom:1px solid var(--line)}
  .lk .qlabel{margin-bottom:10px}
  .lk-row{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;max-width:360px}
  .lk-btn{height:44px;border-radius:10px;border:1px solid var(--line2);background:var(--panel2);color:var(--text);font:600 15px Inter,sans-serif;cursor:pointer;transition:all .15s}
  .lk-btn:hover{border-color:var(--blue-line)}
  .lk-btn.on{background:var(--blue);border-color:var(--blue);color:#fff}
  .lt-sub{color:var(--gold);font-weight:600;margin:4px 0 0}
  .lt-bars{display:grid;gap:8px;margin:16px 0 6px}
  .lt-bar{display:grid;grid-template-columns:170px 1fr;align-items:center;gap:10px;font-size:13.5px;color:var(--muted)}
  .lt-bar i{display:block;height:8px;background:var(--panel2);border-radius:99px;overflow:hidden}
  .lt-bar b{display:block;height:100%;background:linear-gradient(90deg,#4F7CFF,#E8A045);border-radius:99px}
  .lt-h{font-size:16px;color:var(--white);margin:18px 0 0}
  @media (max-width:560px){.lt-bar{grid-template-columns:130px 1fr}}
</style>
</head>

   B:{name:"Le Polyvalent",lead:"Vous êtes à l'aise avec plusieurs façons d'apprendre. Vous vous adaptez aux vidéos, guides, échanges et à la pratique.",tips:["Variez les formats : regarder, lire, échanger, puis pratiquer","Choisissez le format adapté à chaque sujet","Aidez les camarades qui apprennent autrement que vous"]}
  },
  tipsTitle:"Comment vous apprendrez le mieux pendant le bootcamp",
  basis:"Basé sur toutes vos réponses : votre façon d'aborder chaque partie, vos choix et vos notes. Il n'y a pas de bonne ou de mauvaise réponse.",
  doneTitle:"Merci !",
  doneLead:(n)=>`Bravo${n?" "+n:""}. Vos réponses sont bien reçues.`,
  doneNext:"J'étudie vos réponses sous 24 heures et je vous envoie votre plan d'apprentissage personnalisé.",
  saveErr:"Vos réponses n'ont pas pu être envoyées. Vérifiez votre connexion et réessayez. Elles restent enregistrées sur cet appareil."
 }
};

/* ===== FLOW ===== */
const LIKERT = ["v1","r1","s1","h1","v2","r2","s2","h2","v3","r3","s3","h3"];
const PARTS = [
 {id:"profile",  min:2,  fields:[["name","input","name"],["email","email","email"],["phone","tel","tel",true],["why","area"]]},
 {id:"strategy", min:8,  box:true, fields:[["s1q1","area","q1"],["s1q2","area","q2"],["s1q2r","area","q2r"]]},
 {id:"analytics",min:10, box:true, fields:[["s2q1","area","q1"],["s2q2","area","q2"]]},
 {id:"creative", min:8,  box:true, fields:[["s3a","input","a"],["s3b","input","b"],["s3q2","area","q2"]]},
 {id:"ltype",    min:4,  fields:[["lk","likert"]]},
 {id:"style",    min:5,  fields:[["l1","choice"],["l2","choice"],["l3","area"],["l4","area"]]}
];

let lang = (navigator.language||"en").toLowerCase().startsWith("fr") ? "fr" : "en";
try{ const s=localStorage.getItem("ab_lang"); if(s) lang=s; }catch(e){}
let ans = {}, i = -1, times = {}, enteredAt = Date.now(), ok = true;
try{ const d=JSON.parse(localStorage.getItem(DRAFT_KEY)||"null"); if(d&&d.ans){ ans=d.ans; times=d.times||{}; } }catch(e){}
const app=document.getElementById("app");
const L=()=>T[lang];
const esc=s=>String(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function saveDraft(){ try{ localStorage.setItem(DRAFT_KEY, JSON.stringify({ans,times,i})); }catch(e){} }
function clearDraft(){ try{ localStorage.removeItem(DRAFT_KEY); }catch(e){} }
function hasDraft(){ return Object.keys(ans).some(k=>ans[k]); }

function setLang(l){
  lang=l; try{localStorage.setItem("ab_lang",l)}catch(e){}
  document.documentElement.lang=l;
  document.querySelectorAll(".lang button").forEach(b=>b.classList.toggle("on",b.dataset.l===l));
  document.getElementById("tagline").textContent=L().tagline;
  if(typeof i==="number" && i>=0) collect();
  render();
}
document.querySelectorAll(".lang button").forEach(b=>b.onclick=()=>setLang(b.dataset.l));

function render(){
  if(i===-1) return renderIntro();
  if(i==="done") return renderDone();
  const p=PARTS[i], s=L().s[p.id];
  const pct=Math.round(i/PARTS.length*100);
  let h=`<div class="progress"><i style="width:${pct}%"></i></div><div class="step-n">${L().partOf(i+1,PARTS.length,p.min)}</div><h2>${s.t}</h2><p class="hint">${s.h}</p>`;
  if(p.box) h+=`<div class="scenario">${s.box}</div>`;
  for(const f of p.fields){
    const [key,type]=f;
    if(type==="likert"){
      const sc=s.scale;
      h+=`<div class="lk-legend"><span>1 = ${sc[0]}</span><span>5 = ${sc[4]}</span></div>`;
      for(const id of LIKERT){
        const v=ans["lk_"+id];
        h+=`<div class="lk"><div class="qlabel">${s.q[id]}</div><div class="lk-row" role="radiogroup">`;
        for(let n=1;n<=5;n++) h+=`<button type="button" class="lk-btn ${v===n?'on':''}" data-lk="${id}" data-n="${n}" title="${sc[n-1]}" aria-label="${n} – ${sc[n-1]}">${n}</button>`;
        h+=`</div></div>`;
      }
      continue;
    }
    if(type==="choice"){
      const q=s[key];
      h+=`<div class="qblock"><div class="qlabel">${q.t}</div><div class="opts">`;
      for(const [k,v] of Object.entries(q.o)) h+=`<button type="button" class="opt ${ans[key]===k?'on':''}" data-q="${key}" data-k="${k}"><i class="dot"></i><span><b>${k})</b> ${v}</span></button>`;
      h+=`</div></div>`;
      continue;
    }
    const lab = p.id==="profile" ? s[key] : s[f[2]||key];
    if(type==="area") h+=`<div class="qblock"><label class="qlabel" for="${key}">${lab}</label><textarea class="t" id="${key}" rows="4" placeholder="${L().answerPh}">${esc(ans[key])}</textarea></div>`;
    else { const it = type==="input"?"text":type; h+=`<div class="qblock"><label class="qlabel" for="${key}">${lab}</label><input class="t" id="${key}" type="${it}" autocomplete="${key==="name"?"name":type==="email"?"email":type==="tel"?"tel":"off"}" value="${esc(ans[key])}" ${p.id!=="profile"?`placeholder="${L().answerPh}"`:""}></div>`; }
  }
  if(p.id==="profile") h+=`<input class="hp" id="hp" tabindex="-1" autocomplete="off" aria-hidden="true">`;
  const last=i===PARTS.length-1;
  h+=`<div class="err" id="err"></div><div class="nav"><button type="button" class="ghost" id="back">${i>0?"← "+L().back:""}</button><button type="button" class="btn" id="next">${last?L().send:L().next}</button></div>`;
  app.innerHTML=h;
  app.querySelectorAll(".lk-btn").forEach(b=>b.onclick=()=>{ ans["lk_"+b.dataset.lk]=+b.dataset.n; saveDraft(); const er=document.getElementById("err"); if(er) er.textContent=""; b.parentNode.querySelectorAll(".lk-btn").forEach(x=>x.classList.toggle("on",x===b)); });
  app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{ collect(); ans[b.dataset.q]=b.dataset.k; saveDraft(); render(); });
  app.querySelectorAll("textarea,input.t").forEach(el=>el.oninput=()=>{ ans[el.id]=el.value; saveDraft(); });
  document.getElementById("back").onclick=()=>{ if(i>0){ collect(); track(); i--; enteredAt=Date.now(); saveDraft(); render(); window.scrollTo({top:0}); } };
  document.getElementById("next").onclick=go;
}

function collect(){
  if(typeof i!=="number"||i<0) return;
  for(const f of PARTS[i].fields){ const el=document.getElementById(f[0]); if(el && f[1]!=="choice") ans[f[0]]=el.value.trim(); }
}
function track(){ const id=PARTS[i].id; times[id]=(times[id]||0)+Math.round((Date.now()-enteredAt)/1000); }

function go(){
  collect();
  const p=PARTS[i], err=document.getElementById("err");
  if(p.id==="profile"){
    if(document.getElementById("hp").value) return;
    if(!ans.name || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(ans.email||"")){ err.textContent=L().contactErr; return; }
  }
  const missing=p.fields.some(f=> f[1]==="likert" ? LIKERT.some(id=>!ans["lk_"+id]) : (!f[3] && !ans[f[0]]));
  if(missing){ err.textContent=L().required; return; }
  track(); saveDraft();
  if(i===PARTS.length-1) return submit();
  i++; enteredAt=Date.now(); saveDraft(); render(); window.scrollTo({top:0,behavior:"smooth"});
}

function renderIntro(){
  const d=hasDraft();
  app.innerHTML=`<div class="intro"><div class="badge">${L().badge}</div><h1>${L().introTitle}</h1><p class="lead">${L().introLead}</p><ul>${L().introList.map(x=>`<li>${x}</li>`).join("")}</ul>`+
    (d?`<button class="btn" id="resume">${L().resume} →</button> <button class="ghost" id="restart">${L().restart}</button>`:`<button class="btn" id="start">${L().start} →</button>`)+`</div>`;
  const begin=(n)=>{ i=n; enteredAt=Date.now(); render(); };
  if(d){
    document.getElementById("resume").onclick=()=>{ let n=0; try{ n=JSON.parse(localStorage.getItem(DRAFT_KEY)).i||0; }catch(e){} begin(typeof n==="number"&&n>=0&&n<PARTS.length?n:0); };
    document.getElementById("restart").onclick=()=>{ ans={}; times={}; clearDraft(); begin(0); };
  } else document.getElementById("start").onclick=()=>begin(0);
}

/* ===== LEARNING TYPE =====
   Not a right/wrong score: it reads HOW the person answers across the whole form.
   Weights: 1–5 statements 50% · A/B/C/D choices 25% · way they answered parts 1–4 25% */
const CUES = {
  V:/(?<!\p{L})(see|seeing|look|visual|visually|image|images|photo|photos|picture|video|videos|reel|reels|story|stories|colou?r|design|show|voir|regarder|visuel|visuelle|vid[ée]o|couleur|montrer|dessin|sch[ée]ma)(?!\p{L})/giu,
  R:/(?<!\p{L})(first|second|third|then|next|finally|step|steps|plan|structure|analy[sz]e|calculate|because|therefore|so that|d'abord|premi[eè]rement|ensuite|puis|enfin|[ée]tape|[ée]tapes|planifier|analyser|calculer|parce que|donc)(?!\p{L})/giu,
  S:/(?<!\p{L})(ask|asking|talk|discuss|survey|feedback|review|reviews|community|friends|family|team|together|share|word of mouth|comment|comments|demander|parler|[ée]changer|sondage|avis|communaut[ée]|amis|famille|[ée]quipe|ensemble|partager|bouche[- ][àa][- ]oreille)(?!\p{L})/giu,
  H:/(?<!\p{L})(test|testing|try|trying|experiment|launch|practice|practise|adjust|a\/b|optimi[sz]e|start small|tester|essayer|exp[ée]rimenter|lancer|pratique|pratiquer|ajuster|optimiser)(?!\p{L})/giu
};
function answerSignals(){
  const keys=["why","s1q1","s1q2","s1q2r","s2q1","s2q2","s3a","s3b","s3q2","l3","l4"];
  const text=keys.map(k=>ans[k]||"").join("\n");
  const hits={V:0,R:0,S:0,H:0};
  for(const k in CUES) hits[k]=(text.match(CUES[k])||[]).length;
  // Structure of the answers themselves
  const listLines=(text.match(/^\s*(\d+[.)]|[-•*])\s+/gm)||[]).length;
  if(listLines>=2) hits.R+=2;                                   // organises ideas into lists
  if(/[=÷×*\/]/.test(ans.s2q1||"") && (ans.s2q1||"").split(/\n|=/).length>=3) hits.R+=1; // shows working step by step
  if(/[\u{1F300}-\u{1FAFF}\u2600-\u27BF]/u.test((ans.s3a||"")+(ans.s3b||""))) hits.V+=1;   // emojis / imagery in headlines
  if(/\?/.test((ans.s3a||"")+(ans.s3b||""))) hits.S+=1;          // talks to the reader with a question
  // Pace on the thinking parts (2–4), compared with the suggested time
  const spent=(times.strategy||0)+(times.analytics||0)+(times.creative||0), expected=(8+10+8)*60;
  if(spent && spent<expected*0.35) hits.H+=1;                    // goes fast, prefers doing
  if(spent>expected*1.2) hits.R+=1;                              // takes time to think it through
  const total=hits.V+hits.R+hits.S+hits.H;
  const X={}; for(const k in hits) X[k]= total ? hits[k]/total : 0;
  return {X, hits, has: total>0};
}
function learningType(){
  // 1) statements, 1–5
  const sum={V:0,R:0,S:0,H:0}, map={v:"V",r:"R",s:"S",h:"H"};
  for(const id of LIKERT) sum[map[id[0]]]+=(ans["lk_"+id]||3);
  const Lk={}, avg={}; for(const k in sum){ avg[k]=Math.round(sum[k]/3*10)/10; Lk[k]=(sum[k]/3-1)/4; }
  // 2) A/B/C/D choices
  const C={V:0,R:0,S:0,H:0};
  const m1={A:"V",B:"R",C:"S",D:"H"}, m2={A:"R",B:"H",C:"R",D:"S"};
  if(m1[ans.l1]) C[m1[ans.l1]]+=0.67;
  if(m2[ans.l2]) C[m2[ans.l2]]+=0.33;
  // 3) how they answered parts 1–4
  const sig=answerSignals();
  const w = sig.has ? {L:0.5,C:0.25,X:0.25} : {L:0.67,C:0.33,X:0};
  const score={}; for(const k of ["V","R","S","H"]) score[k]=w.L*Lk[k]+w.C*C[k]+w.X*sig.X[k];
  const mx=Math.max(...Object.values(score))||1;
  const pct={}; for(const k in score) pct[k]=Math.round(score[k]/mx*100);
  const order=Object.keys(score).sort((a,b)=>score[b]-score[a]);
  const top=order[0], second=order[1];
  const spread=(score[order[0]]-score[order[3]])/mx;
  const signals=`statements V${avg.V} R${avg.R} S${avg.S} H${avg.H} | choices ${ans.l1||"-"}/${ans.l2||"-"} | answer cues V${sig.hits.V} R${sig.hits.R} S${sig.hits.S} H${sig.hits.H}`;
  if(spread<0.2) return {type:"B", second:null, pct, avg, signals};
  return {type:top, second:(score[second]/score[top]>=0.85?second:null), pct, avg, signals};
}

async function submit(){
  const btn=document.getElementById("next"); btn.disabled=true; btn.textContent=L().sending;
  const en=T.en.s.style;
  const total=Object.values(times).reduce((a,b)=>a+b,0);
  const mins=s=>(Math.round(s/6)/10)+" min";
  const payload={
    ts:new Date().toISOString(), lang,
    name:ans.name, email:ans.email, phone:ans.phone||"", why:ans.why,
    s1q1:ans.s1q1, s1q2:ans.s1q2, s1q2r:ans.s1q2r,
    s2q1:ans.s2q1, s2q2:ans.s2q2,
    s3a:ans.s3a, s3b:ans.s3b, s3q2:ans.s3q2,
    l1:ans.l1+") "+en.l1.o[ans.l1], l2:ans.l2+") "+en.l2.o[ans.l2], l3:ans.l3, l4:ans.l4,
    learning_type: (()=>{ const r=learningType(); return T.en.types[r.type].name+(r.second?" + "+T.en.types[r.second].name:""); })(),
    lt_visual: learningType().pct.V+"%", lt_structured: learningType().pct.R+"%", lt_social: learningType().pct.S+"%", lt_handson: learningType().pct.H+"%",
    lt_signals: learningType().signals,
    likert: LIKERT.map(id=>id+"="+ans["lk_"+id]).join(" "),
    t_ltype:mins(times.ltype||0),
    t_strategy:mins(times.strategy||0), t_analytics:mins(times.analytics||0), t_creative:mins(times.creative||0), t_style:mins(times.style||0), t_total:mins(total),
    page:location.href
  };
  ok=true;
  try{
    if(!ENDPOINT || ENDPOINT.startsWith("PASTE")) throw new Error("no endpoint");
    if(ENDPOINT!=="PREVIEW") await fetch(ENDPOINT,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(payload)});
  }catch(e){ ok=false; }
  if(!ok){ btn.disabled=false; btn.textContent=L().send; document.getElementById("err").textContent=L().saveErr; return; }
  try{ window.dataLayer=window.dataLayer||[]; dataLayer.push({event:"dmm_onboarding_submit"}); }catch(e){}
  clearDraft(); i="done"; render(); window.scrollTo({top:0,behavior:"smooth"});
}

function renderDone(){
  app.innerHTML=`<div class="progress"><i style="width:100%"></i></div><div class="badge">${L().badge}</div><h1>${L().doneTitle}</h1><p class="lead">${L().doneLead(esc((ans.name||"").split(" ")[0]))}</p><p class="lead">${L().doneNext}</p>`+resultCard();
}
function resultCard(){
  const r=learningType(), t=L().types[r.type];
  const sub = r.second ? `<p class="lt-sub">${L().resMix(t.name, L().types[r.second].name)}</p>` : "";
  return `<div class="rec"><span class="tag">${L().resTitle}</span><h2>${t.name}</h2>${sub}<p class="lead" style="margin:10px 0 6px">${t.lead}</p><div class="lt-bars">${["V","R","S","H"].map(k=>`<div class="lt-bar"><span>${L().types[k].name}</span><i><b style="width:${r.pct[k]}%"></b></i></div>`).join("")}</div><h3 class="lt-h">${L().tipsTitle}</h3><ul>${t.tips.map(x=>`<li>${x}</li>`).join("")}</ul><p class="note">${L().basis}</p></div>`;
}

setLang(lang);
</script>
