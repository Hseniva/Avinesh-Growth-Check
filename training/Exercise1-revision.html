:root{--p:#667eea;--p2:#764ba2;--ok:#16a34a;--okbg:#e8f7ee;--bad:#dc2626;--badbg:#fdecec;--ink:#1f2937;--mut:#6b7280;--line:#e5e7eb}

.top a{color:#fff;font-size:13px;text-decoration:none;border:1px solid rgba(255,255,255,.6);padding:6px 12px;border-radius:20px}
.bar{height:6px;background:#eef0fb}.bar div{height:100%;background:linear-gradient(90deg,#667eea,#764ba2);width:0;transition:width .3s}
.body{padding:28px}
.dots{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:20px}
.dot{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);background:#fff;font-size:12px;font-weight:600;color:var(--mut);cursor:pointer}
.dot.cur{border-color:var(--p);color:var(--p)}
.dot.right{background:var(--ok);border-color:var(--ok);color:#fff}
.dot.wrong{background:var(--bad);border-color:var(--bad);color:#fff}
.dot.done{background:var(--p);border-color:var(--p);color:#fff}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:4px 10px;border-radius:12px;margin-right:6px}
.tag.mcq{background:#eef0fb;color:var(--p)}.tag.open{background:#f5ecfb;color:var(--p2)}.tag.topic{background:#f3f4f6;color:var(--mut);font-weight:600}
.q{font-size:19px;font-weight:600;margin:12px 0 16px;line-height:1.45}
.vis{background:#f8f9fc;border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:18px}
.vis svg{width:100%;height:auto;display:block;font-family:'Segoe UI',Tahoma,sans-serif}
.cap{font-size:12px;color:var(--mut);margin-top:6px;text-align:center}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:center;text-align:left;padding:13px 16px;border:2px solid var(--line);border-radius:10px;background:#fff;font-size:15px;cursor:pointer;color:var(--ink);transition:all .15s}
.opt:hover:not(:disabled){border-color:var(--p);background:#f7f8ff}
.opt b{flex:none;width:28px;height:28px;border-radius:50%;background:#eef0fb;color:var(--p);display:flex;align-items:center;justify-content:center;font-size:13px}
.opt.sel{border-color:var(--p);background:#f2f4ff}
.opt.right{border-color:var(--ok);background:var(--okbg)}.opt.right b{background:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--badbg)}.opt.wrong b{background:var(--bad);color:#fff}
.opt:disabled{cursor:default}
textarea{width:100%;min-height:140px;padding:14px;border:2px solid var(--line);border-radius:10px;font:inherit;font-size:15px;resize:vertical}
textarea:focus{outline:none;border-color:var(--p)}
.hint{font-size:13px;color:var(--mut);margin-top:6px}
.fb{margin-top:16px;padding:14px 16px;border-radius:10px;font-size:14.5px;line-height:1.55;display:none}
.fb.show{display:block}.fb.ok{background:var(--okbg);border-left:4px solid var(--ok)}.fb.no{background:var(--badbg);border-left:4px solid var(--bad)}
.fb.model{background:#f5ecfb;border-left:4px solid var(--p2)}
.fb ul{margin:6px 0 0 18px}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:24px;flex-wrap:wrap}
.btn{padding:12px 24px;border:none;border-radius:8px;font-size:15px;font-weight:600;cursor:pointer;transition:all .2s}
.btn-p{background:var(--p);color:#fff}.btn-p:hover{background:#5568d3}
.btn-p:disabled{background:#c7cdf3;cursor:not-allowed}
.btn-g{background:#f3f4f6;color:var(--ink)}.btn-g:hover{background:#e5e7eb}
.btn-v{background:var(--p2);color:#fff}
.intro{text-align:center;padding:10px 0}
.intro h2{color:var(--p);font-size:26px;margin-bottom:8px}
.intro p{color:var(--mut);line-height:1.6;max-width:600px;margin:0 auto 6px}
.stats{display:flex;justify-content:center;gap:14px;margin:22px 0;flex-wrap:wrap}
.stat{background:#f8f9fc;border:1px solid var(--line);border-radius:12px;padding:14px 20px;min-width:120px}
.stat strong{display:block;font-size:24px;color:var(--p)}.stat span{font-size:13px;color:var(--mut)}
.score{font-size:54px;font-weight:800;color:var(--p)}
.rev{margin-top:24px;text-align:left}
.rev h3{color:var(--p2);margin:18px 0 8px;font-size:17px}
.rev .item{border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:8px;font-size:14px;line-height:1.5}
.rev .item em{color:var(--mut);font-style:normal;font-size:13px}
.actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:22px}
.denied{text-align:center;padding:50px 20px}.denied h2{color:var(--p);margin-bottom:10px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#111827;color:#fff;padding:10px 18px;border-radius:8px;font-size:14px;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.show{opacity:1}
@media(max-width:640px){body{padding:8px}.body{padding:18px}.q{font-size:17px}.top h1{font-size:17px}.btn{flex:1}}
</style>

/* ---------- State ---------- */
var me = null, cur = -1, ans = {};
var KEY = 'ex1Answers';
function save(){ try { sessionStorage.setItem(KEY, JSON.stringify({cur:cur, ans:ans})); } catch(e){} }
function load(){ try { var d = JSON.parse(sessionStorage.getItem(KEY) || 'null'); if (d){ ans = d.ans || {}; cur = d.cur == null ? -1 : d.cur; } } catch(e){} }
function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function toast(m){ var t = document.getElementById('toast'); t.textContent = m; t.classList.add('show'); setTimeout(function(){ t.classList.remove('show'); }, 2200); }
var app = document.getElementById('app');
var MCQN = Q.filter(function(q){ return q.t === 'mcq'; }).length, OPENN = Q.length - MCQN;

function score(){ var s = 0; Q.forEach(function(q, i){ if (q.t === 'mcq' && ans[i] && ans[i].c === q.a) s++; }); return s; }
function answered(i){ return ans[i] && (Q[i].t === 'mcq' ? ans[i].done : ans[i].done); }

function setProg(){ var n = 0; for (var i = 0; i < Q.length; i++) if (answered(i)) n++; document.getElementById('prog').style.width = (n / Q.length * 100) + '%'; }

function intro(){
 cur = -1; save(); setProg();
 var n = 0; for (var i = 0; i < Q.length; i++) if (answered(i)) n++;
 app.innerHTML = '<div class="intro"><h2>Hi ' + esc(me.name.split(' ')[0]) + ' 👋</h2>' +
  '<p>Let\'s revise what we covered in <strong>Session 1: the Digital Ecosystem &amp; Tools</strong>.</p>' +
  '<p>Multiple-choice questions give you instant feedback. For open questions, write your answer first, then compare it with the model answer.</p>' +
  '<div class="stats"><div class="stat"><strong>20</strong><span>questions</span></div><div class="stat"><strong>' + MCQN + '</strong><span>multiple choice</span></div><div class="stat"><strong>' + OPENN + '</strong><span>open-ended</span></div><div class="stat"><strong>~25</strong><span>minutes</span></div></div>' +
  '<p>At the end you\'ll send your answers to your trainer.</p>' +
  '<div class="actions"><button class="btn btn-p" onclick="go(' + (n && n < Q.length ? firstOpen() : 0) + ')">' + (n ? (n < Q.length ? 'Continue (' + n + '/20 done)' : 'Review my answers') : 'Start the revision') + '</button>' + (n === Q.length ? '<button class="btn btn-v" onclick="results()">See results</button>' : '') + '</div></div>';
}
function firstOpen(){ for (var i = 0; i < Q.length; i++) if (!answered(i)) return i; return 0; }

function dots(){
 var s = '<div class="dots">';
 for (var i = 0; i < Q.length; i++){
  var c = 'dot'; if (i === cur) c += ' cur';
  if (answered(i)) c += Q[i].t === 'mcq' ? (ans[i].c === Q[i].a ? ' right' : ' wrong') : ' done';
  s += '<button class="' + c + '" onclick="go(' + i + ')" title="Question ' + (i + 1) + '">' + (i + 1) + '</button>';
 }
 return s + '</div>';
}

function go(i){
 cur = i; save(); setProg();
 var q = Q[i], a = ans[i] || {}, h = dots();
 h += '<span class="tag ' + q.t + '">' + (q.t === 'mcq' ? 'Multiple choice' : 'Open question') + '</span><span class="tag topic">' + q.topic + '</span>';
 h += '<div class="q">' + (i + 1) + '. ' + q.q + '</div>';
 h += '<div class="vis">' + V[q.vis] + '<div class="cap">' + q.cap + '</div></div>';
 if (q.t === 'mcq'){
  h += '<div class="opts">';
  q.o.forEach(function(o, k){
   var c = 'opt';
   if (a.done){ if (k === q.a) c += ' right'; else if (k === a.c) c += ' wrong'; }
   else if (a.c === k) c += ' sel';
   h += '<button class="' + c + '" ' + (a.done ? 'disabled' : '') + ' onclick="pick(' + k + ')"><b>' + 'ABCD'[k] + '</b><span>' + esc(o) + '</span></button>';
  });
  h += '</div>';
  h += '<div class="fb ' + (a.done ? 'show ' + (a.c === q.a ? 'ok' : 'no') : '') + '" id="fb">' + (a.done ? (a.c === q.a ? '<strong>✅ Correct!</strong> ' : '<strong>❌ Not quite.</strong> The answer is <strong>' + 'ABCD'[q.a] + '</strong>. ') + q.e : '') + '</div>';
 } else {
  h += '<textarea id="ta" placeholder="' + esc(q.ph) + '" oninput="typing()">' + esc(a.text || '') + '</textarea>';
  h += '<div class="hint">Write in your own words. Bullet points are fine.</div>';
  h += '<div class="fb model ' + (a.done ? 'show' : '') + '" id="fb"><strong>💡 Model answer: compare it with yours</strong><ul>' + q.m.map(function(x){ return '<li>' + x + '</li>'; }).join('') + '</ul></div>';
 }
 var last = i === Q.length - 1;
 h += '<div class="nav"><button class="btn btn-g" onclick="' + (i ? 'go(' + (i - 1) + ')' : 'intro()') + '">← Back</button>';
 if (q.t === 'mcq' && !a.done) h += '<button class="btn btn-p" id="chk" ' + (a.c == null ? 'disabled' : '') + ' onclick="check()">Check answer</button>';
 else if (q.t === 'open' && !a.done) h += '<button class="btn btn-p" id="chk" ' + ((a.text || '').trim().length < 5 ? 'disabled' : '') + ' onclick="saveOpen()">Save &amp; see model answer</button>';
 else h += '<button class="btn btn-p" onclick="' + (last ? 'results()' : 'go(' + (i + 1) + ')') + '">' + (last ? 'See my results →' : 'Next →') + '</button>';
 h += '</div>';
 app.innerHTML = h;
 window.scrollTo({top:0, behavior:'smooth'});
}

function pick(k){ ans[cur] = {c:k}; save(); go(cur); }
function check(){ ans[cur].done = true; save(); go(cur); }
function typing(){ var v = document.getElementById('ta').value; ans[cur] = {text:v}; save(); document.getElementById('chk').disabled = v.trim().length < 5; }
function saveOpen(){ var v = document.getElementById('ta').value.trim(); if (v.length < 5) return; ans[cur] = {text:v, done:true}; save(); go(cur); }

function report(){
 var lines = ['DMM - Module 1 - Exercise 1: Session 1 Revision', 'Student: ' + me.name + ' <' + me.email + '>', 'Date: ' + new Date().toLocaleString('en-GB'), 'MCQ score: ' + score() + '/' + MCQN, ''];
 Q.forEach(function(q, i){
  var a = ans[i] || {};
  lines.push('Q' + (i + 1) + ' [' + (q.t === 'mcq' ? 'MCQ' : 'OPEN') + '] ' + q.q.replace(/<[^>]+>/g, ''));
  if (q.t === 'mcq') lines.push('  Answer: ' + (a.done ? 'ABCD'[a.c] + ' - ' + q.o[a.c] + (a.c === q.a ? ' (correct)' : ' (incorrect, correct: ' + 'ABCD'[q.a] + ')') : '(not answered)'));
  else lines.push('  Answer: ' + (a.text ? a.text.replace(/\n/g, '\n          ') : '(not answered)'));
  lines.push('');
 });
 return lines.join('\n');
}

function results(){
 cur = Q.length; save(); setProg();
 var sc = score(), pct = Math.round(sc / MCQN * 100), todo = [];
 for (var i = 0; i < Q.length; i++) if (!answered(i)) todo.push(i + 1);
 var msg = pct >= 85 ? 'Excellent! You have a solid grip on the digital ecosystem.' : pct >= 60 ? 'Good work. Review the topics you missed before the next session.' : 'Keep going. Re-read the Week 1 notes and try the questions you missed again.';
 var h = '<div class="intro"><h2>Your results</h2><div class="score">' + sc + '/' + MCQN + '</div><p>Multiple choice · ' + pct + '%</p><p>' + msg + '</p>';
 if (todo.length) h += '<p style="color:#dc2626;margin-top:10px">Still unanswered: Q' + todo.join(', Q') + '</p>';
 if (window.DMM && DMM.configured() && DMM.session()) h += '<div id="saveBox" style="margin:20px auto 0;max-width:580px;padding:16px 18px;border-radius:12px;background:#f3f2fc;line-height:1.6">' + (todo.length ? 'Answer all 20 questions, then submit your score to your progress.' : '<button class="btn btn-p" id="saveBtn" onclick="saveScore()">✅ Submit my score to my progress</button><div style="margin-top:8px;font-size:13px;color:#6b7280">Your best attempt counts towards your module progress.</div>') + '</div>';
 h += '<div class="actions"><button class="btn btn-p" onclick="sendMail()">📧 Email my answers to the trainer</button><button class="btn btn-v" onclick="copyAns()">📋 Copy my answers</button><button class="btn btn-g" onclick="dl()">⬇ Download (.txt)</button></div>';
 h += '<div class="rev"><h3>Review</h3>';
 Q.forEach(function(q, i){
  var a = ans[i] || {}, mark = q.t === 'mcq' ? (a.done ? (a.c === q.a ? '✅' : '❌') : '⬜') : (a.done ? '📝' : '⬜');
  h += '<div class="item">' + mark + ' <strong>Q' + (i + 1) + '.</strong> ' + q.topic + ' <em>· <a href="#" onclick="go(' + i + ');return false">open</a></em></div>';
 });
 h += '</div><div class="actions"><button class="btn btn-g" onclick="restart()">↺ Start again</button></div></div>';
 app.innerHTML = h; window.scrollTo({top:0, behavior:'smooth'});
}

function saveScore(){
 var b = document.getElementById('saveBtn'); b.disabled = true; b.textContent = 'Saving…';
 DMM.api('quiz', {module: QUIZ_MODULE, score: score(), total: MCQN, answers: report()}).then(function(r){
  var box = document.getElementById('saveBox');
  if (!r.ok){ if (r.authError){ location.href = '/?next=/Exercise1-revision'; return; } b.disabled = false; b.textContent = 'Try again'; toast(r.error || 'Could not save your score'); return; }
  try{Object.keys(sessionStorage).forEach(function(k){if(k.indexOf("dmm_dash")===0||k==="dmm_my")sessionStorage.removeItem(k);});}catch(e){}
  box.innerHTML = r.result.passed ? '<strong>🎉 Passed with ' + r.result.pct + '%!</strong> Your revision quiz is complete and your progress has been updated. <a href="/">Back to my dashboard →</a>' : '<strong>' + r.result.pct + '%: not passed yet</strong> (pass mark ' + r.result.pass_mark + '%). Review the questions you missed, then press <em>Start again</em> below to retry. <a href="/">Back to my dashboard</a>';
 });
}
function sendMail(){
 var body = report();
 if (body.length > 1700) body = body.slice(0, 1700) + '\n\n[...truncated - full answers attached / pasted below]';
 window.location.href = 'mailto:' + TRAINER + '?subject=' + encodeURIComponent('Module 1 - Exercise 1 Revision - ' + me.name) + '&body=' + encodeURIComponent(body);
 copyAns(true);
}
function copyAns(silent){
 var txt = report();
 function done(){ toast(silent ? 'Full answers also copied: paste them into the email if they were cut off' : 'Answers copied to clipboard'); }
 if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(done, function(){ fallbackCopy(txt); done(); });
 else { fallbackCopy(txt); done(); }
}
function fallbackCopy(t){ var x = document.createElement('textarea'); x.value = t; document.body.appendChild(x); x.select(); try { document.execCommand('copy'); } catch(e){} x.remove(); }
function dl(){ var b = new Blob([report()], {type:'text/plain'}), u = URL.createObjectURL(b), l = document.createElement('a'); l.href = u; l.download = 'Exercise1-Revision-' + me.name.replace(/\s+/g, '_') + '.txt'; document.body.appendChild(l); l.click(); l.remove(); setTimeout(function(){ URL.revokeObjectURL(u); }, 1000); }
function restart(){ ans = {}; save(); go(0); }

/* ---------- Access check ---------- */
(function(){
 var PLATFORM = !!(window.DMM && DMM.configured());
 if (PLATFORM){ me = DMM.session(); if (!me){ location.replace('/?next=/Exercise1-revision'); return; } me.name = me.name || me.email; }
 else { try { me = JSON.parse(sessionStorage.getItem('moduleSession') || 'null'); } catch(e){ me = null; } }
 if (!me || (!PLATFORM && AUTH.indexOf(String(me.email).toLowerCase()) < 0)){
  document.getElementById('who').textContent = 'Restricted access';
  app.innerHTML = '<div class="denied"><h2>🔒 Please log in first</h2><p>This exercise is only for enrolled students. Log in on the Module 1 page, then click <strong>Exercise 1</strong> again.</p><div class="actions"><a class="btn btn-p" style="text-decoration:none" href="/Module1-digitalfoundations">Go to Module 1 login</a></div></div>';
  return;
 }
 document.getElementById('who').textContent = 'Logged in as ' + me.name;
 load();
 if (cur >= 0 && cur < Q.length) go(cur); else if (cur === Q.length) results(); else intro();
})();
</script>
